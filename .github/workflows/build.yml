name: Java CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y ant unzip curl

      - name: Download JavaFX SDK
        run: |
          JFX_VERSION=26.0.2
          curl -fsSL -o openjfx.zip "https://download2.gluonhq.com/openjfx/${JFX_VERSION}/openjfx-${JFX_VERSION}_linux-x64_bin-sdk.zip"
          rm -rf "javafx-sdk-${JFX_VERSION}"
          unzip -oq openjfx.zip
          test -d "javafx-sdk-${JFX_VERSION}/lib"

      - name: Build with Ant
        run: ant -noinput -buildfile build.xml jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-jar
          path: dist/*.jar
          retention-days: 7
